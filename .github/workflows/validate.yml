name: Validate GoCat

on:
  push:
    branches: ["main", "gocat-live-functionality-upgrades", "gocat-mobile-ui-polish", "gocat-commercial-polish"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check randomgo.js
          node --check gocat-enhancements.js
          node --check gocat-commercial-polish.js
          node --check gocat-pwa.js
          node --check sw.js
      - name: Validate Vercel and PWA JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
